name: Local Sonar Analysis

on:
  push:
    branches:
      - main  

jobs:
  build:
    name: Build and Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN1 }}
          SONAR_HOST_URL: https://four-buttons-sort.loca.lt
        with:
          args: >
            -Dsonar.ws.truststore=true
            -Dsonar.verbose=true